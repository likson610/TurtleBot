services:
  wifi_scanner:
    build: .
    container_name: ros2_wifi_scanner
    network_mode: "host"
    ipc: "host"
    privileged: true
    volumes:
      - /dev:/dev
      - /sys:/sys
    environment:
      - ROS_DOMAIN_ID=0
      - PYTHONUNBUFFERED=1
      - WIFI_INTERFACE=wlan1
      - SCAN_FREQUENCIES=2412 2417 2422 2427 2432 2437 2442 2447 2452 2457 2462 2467 2472
    restart: unless-stopped