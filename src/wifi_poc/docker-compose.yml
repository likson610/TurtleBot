services:
  wifi_scanner:
    build: .
    container_name: ros2_wifi_scanner
    network_mode: "host"
    ipc: "host"
    privileged: true
    volumes:
      - /dev:/dev
      - /sys:/sys
    environment:
      - ROS_DOMAIN_ID=0
      - PYTHONUNBUFFERED=1
      - WIFI_INTERFACE=wlan1
      - SCAN_FREQUENCIES=2412 2437 2462
    command: ["python3", "-u", "/app/wifi_scanner.py"]
    restart: unless-stopped

  wifi_heatmap:
    build: .
    container_name: ros2_wifi_heatmap
    network_mode: "host"
    ipc: "host"
    environment:
      - ROS_DOMAIN_ID=0
      - PYTHONUNBUFFERED=1
    command: ["python3", "-u", "/app/wifi_heatmap_node.py"]
    depends_on:
      - wifi_scanner
    restart: unless-stopped