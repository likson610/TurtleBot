version: '3.8'

services:
  wifi_scanner:
    build: .
    container_name: ros2_wifi_scanner
    network_mode: "host"
    privileged: true
    volumes:
      - /dev:/dev
      - /sys:/sys
    environment:
      - ROS_DOMAIN_ID=0
      - PYTHONUNBUFFERED=1
      - WIFI_INTERFACE=wlan1
      #- SCAN_FREQUENCIES=2412 2437 2462
    restart: unless-stopped